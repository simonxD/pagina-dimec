intro: >-
  La vinculación con el medio conecta la docencia y la investigación del
  Departamento con la industria, sus titulados y la comunidad.

# El campo `id` es el ancla del enlace del menú principal: /vinculacion#alumni.
# Si se cambia aquí, hay que cambiarlo también en app/utils/navigation.ts.
secciones:
  - id: oportunidades
    titulo: Oportunidades de carrera e industrias
    texto: >-
      Sectores donde ejercen nuestros egresados y egresadas, y vías de colaboración
      con empresas que buscan perfiles de ingeniería mecánica.
    enlace:
      label: Ver oportunidades
      to: /oportunidades
      externo: false
  - id: alumni
    titulo: Alumni
    texto: >-
      Red de titulados del Departamento: actividades de reencuentro, mentorías a
      estudiantes y participación en la vida académica.
    enlace:
      label: Alumni USM
      to: https://www.exalumnos.usm.cl/
      externo: true
  - id: visitas
    titulo: Visitas al DIMEC
    texto: >-
      Recorridos por los laboratorios y charlas para colegios, institutos y
      organizaciones interesadas en conocer la carrera de cerca.
    enlace:
      label: Solicitar una visita
      to: /contacto
      externo: false
  - id: donaciones
    titulo: Donaciones
    texto: >-
      Aportes destinados a equipamiento de laboratorios, becas y proyectos de
      investigación del Departamento.
    enlace:
      label: Portal de donaciones USM
      to: https://donaciones.usm.cl/
      externo: true
  - id: servicios
    titulo: Servicios a externos
    texto: >-
      Ensayos de laboratorio, asesorías técnicas, peritajes y estudios de ingeniería
      para empresas e instituciones.
    enlace:
      label: Consultar por un servicio
      to: /contacto
      externo: false
  - id: idea
    titulo: ¿Tienes una idea?
    texto: >-
      Si tienes un proyecto, una necesidad técnica o una propuesta de colaboración,
      cuéntanos de qué se trata y buscamos con quién encaja dentro del Departamento.
    enlace:
      label: Escríbenos
      to: /contacto
      externo: false
